restrictions:
  - name: "STL private Link authorization"
    match:
      - !PathPrefix "^stl0123456789abcdef0123456789abcdef$"
      - !Authorization "^Bearer aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa$"
    allow:
      - !Tunnel
        protocol:
          - Udp
        port:
          - 53000
        host: "^127\\.0\\.0\\.1$"
        cidr:
          - 127.0.0.1/32

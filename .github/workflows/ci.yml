name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: go version
      - name: Formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            gofmt -d .
            exit 1
          fi
      - name: Privileged E2E runner syntax (no host mutation)
        run: |
          bash -n scripts/e2e/gre-netns.sh
          bash -n scripts/e2e/wireguard-netns.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Offline installer regression
        run: bash scripts/test-install.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Toolchain
        run: go version
      - name: Formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            gofmt -d .
            exit 1
          fi
      - name: Privileged E2E runner syntax (no host mutation)
        run: |
          bash -n scripts/quick-install.sh
          bash -n scripts/test-quick-install.sh
          bash -n scripts/e2e/gre-netns.sh
          bash -n scripts/e2e/gre-multipeer-netns.sh
          bash -n scripts/e2e/cross-backend-docker.sh
          bash -n scripts/e2e/snapshot-install-smoke.sh
          bash -n scripts/e2e/local-one-command-docker.sh
          bash -n scripts/local-install-entrypoint.sh
          bash -n scripts/e2e/wireguard-netns.sh
          bash -n scripts/e2e/wss-wg-ingress-netns.sh
          bash -n scripts/e2e/wss-managed-wireguard-r1.sh
          bash -n scripts/e2e/wss-managed-wireguard-matrix.sh
          python3 -c 'import ast,sys; [ast.parse(open(p).read()) for p in sys.argv[1:]]' scripts/e2e/wss-negative-probe.py scripts/e2e/wss-r1-supervisor.py scripts/e2e/wss-r2-nft-crash.py scripts/e2e/wss-r2-legacy-drift.py scripts/e2e/wss-r2-wg-crash.py scripts/e2e/wss-r4-partial-wg.py scripts/e2e/wss-r4-guard-interloper.py
          bash -n scripts/e2e/ipsec-two-peer-netns.sh
          bash -n scripts/e2e/ipsec-installed-systemd.sh
          bash -n scripts/e2e/ipsec-managed-prepare-systemd.sh
          bash -n scripts/e2e/package-prepare-docker.sh
      - name: Canonical installer embedded byte-identity
        run: |
          bash -n scripts/install.sh
          cmp -s scripts/install.sh cmd/stl/canonical-installer.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Offline installer regression
        run: |
          bash scripts/test-install.sh
          bash scripts/test-install-requirements.sh
          bash scripts/test-quick-install.sh
      - name: Transferable architecture-specific local bundle smoke
        run: GOTOOLCHAIN=local bash scripts/e2e/snapshot-install-smoke.sh

  # No connected server is touched. Prove the literal service property on
  # disposable GitHub-hosted systemd 249 and a newer systemd environment.
  wss-reconnect-systemd:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: New transient service post-start command survives controlled restart
        shell: bash
        run: |
          set -euo pipefail
          unit="stl-wss-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          # The probe must fail benignly without sending traffic into any
          # existing interface on this disposable GitHub runner.
          test -x /usr/bin/ping
          test ! -e /sys/class/net/stlwg0123456789
          trap 'sudo systemctl stop "$unit" >/dev/null 2>&1 || :' EXIT
          sudo systemd-run --unit="${unit%.service}" --collect \
            --description='STL disposable post-start policy acceptance' \
            --property=Type=exec \
            --property=Restart=on-failure \
            --property=RestartSec=2s \
            --property='ExecStartPost=-/usr/bin/ping -q -n -I stlwg0123456789 -s 8 -c 8 -i 0.25 -W 1 10.99.1.2' \
            /usr/bin/sleep 90
          sudo systemctl show "$unit" -p ExecStartPost --value | grep -Fq 'argv[]=/usr/bin/ping -q -n -I stlwg0123456789 -s 8 -c 8 -i 0.25 -W 1 10.99.1.2'
          sudo systemctl show "$unit" -p ExecStartPost --value | grep -Fq 'ignore_errors=yes'
          test "$(sudo systemctl show "$unit" -p ActiveState --value)" = active
          sudo systemctl restart "$unit"
          sudo systemctl show "$unit" -p ExecStartPost --value | grep -Fq 'argv[]=/usr/bin/ping -q -n -I stlwg0123456789 -s 8 -c 8 -i 0.25 -W 1 10.99.1.2'
          sudo systemctl show "$unit" -p ExecStartPost --value | grep -Fq 'ignore_errors=yes'
          test "$(sudo systemctl show "$unit" -p ActiveState --value)" = active
          echo 'DISPOSABLE_SYSTEMD_EXECSTARTPOST_RESTART=PASS'

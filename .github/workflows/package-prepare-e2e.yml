# Real APT behavior is proved in an ephemeral Docker guest. Never install
# packages on the CI runner or a live owner/Agent server.
name: Disposable package-only prerequisite E2E

on:
  pull_request:
    paths:
      - '.github/workflows/package-prepare-e2e.yml'
      - 'scripts/install.sh'
      - 'scripts/e2e/package-prepare-docker.sh'
      - 'scripts/build-artifacts.sh'
      - 'cmd/stl/**'

permissions:
  contents: read

jobs:
  selected-apt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exact source and isolated host preflight
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test ! -e /.dockerenv
          test -z "$(git status --porcelain)"
          docker version
      - name: Real Ubuntu package-only provisioning
        env:
          STL_E2E_DISPOSABLE_HOST: approved
        run: bash scripts/e2e/package-prepare-docker.sh
      - name: Verified Debian 12 archive signer and live package index preview
        run: |
          set -euo pipefail
          docker run --rm --network bridge \
            -e STL_E2E_DISPOSABLE_GUEST=approved \
            -v "$PWD/scripts/install.sh:/mnt/stl-install.sh:ro" \
            debian:bookworm bash -c '
              set -euo pipefail
              [[ $EUID == 0 && -e /.dockerenv && $STL_E2E_DISPOSABLE_GUEST == approved ]]
              apt-get update -qq
              preview=$(bash /mnt/stl-install.sh requirements --backends native,ipsec)
              grep -qx "distribution=debian" <<< "$preview"
              grep -q "^apt_install=.*charon-systemd=" <<< "$preview"
              ! dpkg-query -W -f="\${Status}" charon-systemd 2>/dev/null | grep -q "install ok installed"
              echo "IPSEC_REAL_DEBIAN_SIGNED_DISTRIBUTION_CANDIDATE=PASS"
            '

name: Spoof Diagnostics (independent Go)

on:
  pull_request:
    # Review-stack PR bases use feat/spoofdiag-*; they must receive the same
    # dedicated nested-Go and installer checks as dev-spoof integration PRs.
    branches: [dev-spoof, main, 'feat/spoofdiag-*']
    paths:
      - 'research/spoof-diagnostics/**'
      - '.github/workflows/spoofdiag-ci.yml'
  push:
    branches: [dev-spoof, main]
    paths:
      - 'research/spoof-diagnostics/**'
      - '.github/workflows/spoofdiag-ci.yml'

permissions:
  contents: read

jobs:
  offline-go-and-installer:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: research/spoof-diagnostics
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: research/spoof-diagnostics/go.mod
          cache: false
      - name: Go validation with offline dependency resolution
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(gofmt -l cmd/stl-spoofdiag scripts/test-fixture-http)"
          go vet ./...
          go test -count=1 ./...
      - name: Standalone offline build / install / re-install
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          bash -n scripts/build-offline.sh scripts/package-offline.sh scripts/install-offline.sh
          mkdir -p "$RUNNER_TEMP/spoofdiag-testroot" "$RUNNER_TEMP/spoofdiag-extracted"
          bash scripts/package-offline.sh "$RUNNER_TEMP/spoofdiag-offline" "$SOURCE_SHA" dev-ci amd64
          ( cd "$RUNNER_TEMP/spoofdiag-offline"; sha256sum -c spoofdiag-dev-ci_linux_amd64.tar.gz.sha256 )
          tar -C "$RUNNER_TEMP/spoofdiag-extracted" -xzf "$RUNNER_TEMP/spoofdiag-offline/spoofdiag-dev-ci_linux_amd64.tar.gz"
          bundle="$RUNNER_TEMP/spoofdiag-extracted/stl-spoofdiag"
          bash "$bundle/install-offline.sh" --verify
          bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-testroot"
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" version
          test "$(stat -c %a "$RUNNER_TEMP/spoofdiag-testroot/opt/stl-spoofdiag")" = 755
          test "$(stat -c %a "$RUNNER_TEMP/spoofdiag-testroot/opt/stl-spoofdiag/releases/dev-ci")" = 755
          bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-testroot"
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" plan --file examples/sources-field.csv
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" report --file examples/evidence-field.json

          # Negative controls: a locally corrupted bundle and foreign launcher
          # must be rejected without invoking network or changing STL.
          cp -a "$bundle" "$RUNNER_TEMP/spoofdiag-corrupt"
          printf 'tampered' >> "$RUNNER_TEMP/spoofdiag-corrupt/stl-spoofdiag"
          if bash "$RUNNER_TEMP/spoofdiag-corrupt/install-offline.sh" --verify; then
            echo 'ERROR: corrupted payload was accepted' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/spoofdiag-foreign/usr/local/bin"
          printf 'foreign' > "$RUNNER_TEMP/spoofdiag-foreign/usr/local/bin/stl-spoofdiag"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-foreign"; then
            echo 'ERROR: foreign launcher was overwritten' >&2
            exit 1
          fi

          # Regression: an apparently owned directory reached through a
          # symlinked intermediate /opt path must never receive installs.
          mkdir -p "$RUNNER_TEMP/spoofdiag-symlink/opt"
          ln -s "$RUNNER_TEMP/spoofdiag-testroot/opt/stl-spoofdiag" "$RUNNER_TEMP/spoofdiag-symlink/opt/stl-spoofdiag"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-symlink"; then
            echo 'ERROR: symlinked install intermediate was accepted' >&2
            exit 1
          fi

          # A package for the other architecture must be rejected on AMD64.
          bash scripts/package-offline.sh "$RUNNER_TEMP/spoofdiag-arm64" "$SOURCE_SHA" dev-ci arm64
          mkdir -p "$RUNNER_TEMP/spoofdiag-arm64-extracted"
          tar -C "$RUNNER_TEMP/spoofdiag-arm64-extracted" -xzf "$RUNNER_TEMP/spoofdiag-arm64/spoofdiag-dev-ci_linux_arm64.tar.gz"
          if bash "$RUNNER_TEMP/spoofdiag-arm64-extracted/stl-spoofdiag/install-offline.sh" --verify; then
            echo 'ERROR: wrong architecture accepted' >&2
            exit 1
          fi

          # Fully offline lifecycle: second complete local bundle, verified
          # upgrade, rollback, integrity refusal, foreign resource preservation,
          # uninstall and operator configuration/evidence retention.
          root="$RUNNER_TEMP/spoofdiag-testroot"
          mkdir -p "$root/etc/stl-spoofdiag" "$root/var/lib/stl-spoofdiag"
          printf 'operator-owned' > "$root/etc/stl-spoofdiag/operator.conf"
          printf 'peer-receipts' > "$root/var/lib/stl-spoofdiag/evidence.json"
          bash scripts/build-offline.sh "$RUNNER_TEMP/spoofdiag-prev" "$SOURCE_SHA" dev-prev-ci amd64
          bash "$RUNNER_TEMP/spoofdiag-prev/install-offline.sh" --install --accept --destdir "$root"
          "$root/usr/local/bin/stl-spoofdiag" version | grep -Fq 'dev-prev-ci'
          bash "$bundle/install-offline.sh" --rollback --to dev-ci --accept --destdir "$root"
          "$root/usr/local/bin/stl-spoofdiag" version | grep -Fq 'dev-ci'
          # The stored executable must not be activated if its hash changed.
          printf 'corrupted' >> "$root/opt/stl-spoofdiag/releases/dev-prev-ci/stl-spoofdiag"
          if bash "$bundle/install-offline.sh" --rollback --to dev-prev-ci --accept --destdir "$root"; then
            echo 'ERROR: corrupted stored release was activated' >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/spoofdiag-prev/stl-spoofdiag" "$root/opt/stl-spoofdiag/releases/dev-prev-ci/stl-spoofdiag"

          # Simulate a killed installer leaving a partially populated, strictly
          # tool-owned stage. Recovery happens only with the destination lock.
          stage="$root/opt/stl-spoofdiag/releases/.stage.ABCDEFGH"
          mkdir "$stage"
          printf 'partial staged executable' > "$stage/stl-spoofdiag"
          bash "$bundle/install-offline.sh" --install --accept --destdir "$root" > "$RUNNER_TEMP/spoofdiag-stage-recovered.log"
          grep -Fq 'Recovered owned incomplete install stage:' "$RUNNER_TEMP/spoofdiag-stage-recovered.log"
          test ! -e "$stage"

          # An unknown file must NOT be deleted under a lookalike stage.
          foreign_stage="$root/opt/stl-spoofdiag/releases/.stage.IJKLMNOP"
          mkdir "$foreign_stage"
          printf 'operator-owned' > "$foreign_stage/unknown"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$root"; then
            echo 'ERROR: foreign interrupted stage was adopted or removed' >&2
            exit 1
          fi
          test -f "$foreign_stage/unknown"
          rm -- "$foreign_stage/unknown"
          rmdir -- "$foreign_stage"

          # Two installers of the same destination must not race current.
          ( exec 9< "$root/opt"; flock -n 9; touch "$RUNNER_TEMP/spoofdiag-lock-ready"; sleep 5 ) &
          lock_holder=$!
          for i in $(seq 1 30); do
            test ! -f "$RUNNER_TEMP/spoofdiag-lock-ready" || break
            sleep .1
          done
          test -f "$RUNNER_TEMP/spoofdiag-lock-ready"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$root" > "$RUNNER_TEMP/spoofdiag-lock-denial.log" 2>&1; then
            echo 'ERROR: concurrent install acquired busy destination' >&2
            exit 1
          fi
          grep -Fq 'another installer is active' "$RUNNER_TEMP/spoofdiag-lock-denial.log"
          wait "$lock_holder"

          printf 'foreign' > "$root/opt/stl-spoofdiag/not-ours"
          if bash "$bundle/install-offline.sh" --uninstall --accept --destdir "$root"; then
            echo 'ERROR: uninstall removed or ignored foreign resource' >&2
            exit 1
          fi
          test -f "$root/opt/stl-spoofdiag/not-ours"
          rm -- "$root/opt/stl-spoofdiag/not-ours"
          bash "$bundle/install-offline.sh" --uninstall --accept --destdir "$root"
          bash "$bundle/install-offline.sh" --uninstall --accept --destdir "$root"
          test ! -e "$root/opt/stl-spoofdiag"
          test ! -e "$root/usr/local/bin/stl-spoofdiag"
          test "$(cat "$root/etc/stl-spoofdiag/operator.conf")" = 'operator-owned'
          test "$(cat "$root/var/lib/stl-spoofdiag/evidence.json")" = 'peer-receipts'
      - name: Online bootstrap local HTTP end-to-end and failure controls
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          bash -n scripts/online-bootstrap.sh scripts/test-online-bootstrap.sh
          bash scripts/test-online-bootstrap.sh
      - name: Validate tool-specific prerelease assembly (no publication)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev-spoof'
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          bash scripts/prepare-release.sh spoofdiag-v0.1.0-rc.1 "$RUNNER_TEMP/spoofdiag-tool-release-candidate"
          (
            cd "$RUNNER_TEMP/spoofdiag-tool-release-candidate"
            sha256sum -c SHA256SUMS
            test -f spoofdiag-v0.1.0-rc.1_linux_amd64.tar.gz
            test -f spoofdiag-v0.1.0-rc.1_linux_arm64.tar.gz
            test -f online-bootstrap.sh
            test -f RELEASE-SOURCE.txt
            test ! -f spoofdiag-spoofdiag-v0.1.0-rc.1_linux_amd64.tar.gz
          )
      - name: Retain SHA-pinned unreleased lab archives
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spoofdiag-lab-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/spoofdiag-offline/spoofdiag-dev-ci_linux_amd64.tar.gz
            ${{ runner.temp }}/spoofdiag-offline/spoofdiag-dev-ci_linux_amd64.tar.gz.sha256
            ${{ runner.temp }}/spoofdiag-arm64/spoofdiag-dev-ci_linux_arm64.tar.gz
            ${{ runner.temp }}/spoofdiag-arm64/spoofdiag-dev-ci_linux_arm64.tar.gz.sha256

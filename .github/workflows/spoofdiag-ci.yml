name: Spoof Diagnostics (independent Go)

on:
  pull_request:
    paths:
      - 'research/spoof-diagnostics/**'
      - '.github/workflows/spoofdiag-ci.yml'
  push:
    branches: [main]
    paths:
      - 'research/spoof-diagnostics/**'
      - '.github/workflows/spoofdiag-ci.yml'

permissions:
  contents: read

jobs:
  offline-go-and-installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/spoof-diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: research/spoof-diagnostics/go.mod
          cache: false
      - name: Go validation with offline dependency resolution
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          test -z "$(gofmt -l cmd/stl-spoofdiag)"
          go vet ./...
          go test -count=1 ./...
      - name: Standalone offline build / install / re-install
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
          CGO_ENABLED: '0'
        run: |
          bash -n scripts/build-offline.sh scripts/package-offline.sh scripts/install-offline.sh
          mkdir -p "$RUNNER_TEMP/spoofdiag-testroot" "$RUNNER_TEMP/spoofdiag-extracted"
          bash scripts/package-offline.sh "$RUNNER_TEMP/spoofdiag-offline" "$GITHUB_SHA" dev-ci amd64
          ( cd "$RUNNER_TEMP/spoofdiag-offline"; sha256sum -c spoofdiag-dev-ci_linux_amd64.tar.gz.sha256 )
          tar -C "$RUNNER_TEMP/spoofdiag-extracted" -xzf "$RUNNER_TEMP/spoofdiag-offline/spoofdiag-dev-ci_linux_amd64.tar.gz"
          bundle="$RUNNER_TEMP/spoofdiag-extracted/stl-spoofdiag"
          bash "$bundle/install-offline.sh" --verify
          bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-testroot"
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" version
          bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-testroot"
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" plan --file examples/sources-private.csv
          "$RUNNER_TEMP/spoofdiag-testroot/usr/local/bin/stl-spoofdiag" report --file examples/evidence-private.json

          # Negative controls: a locally corrupted bundle and foreign launcher
          # must be rejected without invoking network or changing STL.
          cp -a "$bundle" "$RUNNER_TEMP/spoofdiag-corrupt"
          printf 'tampered' >> "$RUNNER_TEMP/spoofdiag-corrupt/stl-spoofdiag"
          if bash "$RUNNER_TEMP/spoofdiag-corrupt/install-offline.sh" --verify; then
            echo 'ERROR: corrupted payload was accepted' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/spoofdiag-foreign/usr/local/bin"
          printf 'foreign' > "$RUNNER_TEMP/spoofdiag-foreign/usr/local/bin/stl-spoofdiag"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-foreign"; then
            echo 'ERROR: foreign launcher was overwritten' >&2
            exit 1
          fi

          # Regression: an apparently owned directory reached through a
          # symlinked intermediate /opt path must never receive installs.
          mkdir -p "$RUNNER_TEMP/spoofdiag-symlink/opt"
          ln -s "$RUNNER_TEMP/spoofdiag-testroot/opt/stl-spoofdiag" "$RUNNER_TEMP/spoofdiag-symlink/opt/stl-spoofdiag"
          if bash "$bundle/install-offline.sh" --install --accept --destdir "$RUNNER_TEMP/spoofdiag-symlink"; then
            echo 'ERROR: symlinked install intermediate was accepted' >&2
            exit 1
          fi

          # A package for the other architecture must be rejected on AMD64.
          bash scripts/package-offline.sh "$RUNNER_TEMP/spoofdiag-arm64" "$GITHUB_SHA" dev-ci arm64
          mkdir -p "$RUNNER_TEMP/spoofdiag-arm64-extracted"
          tar -C "$RUNNER_TEMP/spoofdiag-arm64-extracted" -xzf "$RUNNER_TEMP/spoofdiag-arm64/spoofdiag-dev-ci_linux_arm64.tar.gz"
          if bash "$RUNNER_TEMP/spoofdiag-arm64-extracted/stl-spoofdiag/install-offline.sh" --verify; then
            echo 'ERROR: wrong architecture accepted' >&2
            exit 1
          fi
